{% set name = "DASPy-toolbox" %}
{% set version = "1.2.7" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') | lower }}-{{ version }}.tar.gz
  sha256: e2b55ae1be5977b270646efbb70a287a93b668727f26bcb27cae92fbf9a02fe7

build:
  entry_points:
    - daspy = daspy.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - scipy >=1.13
    - matplotlib-base
    - geographiclib
    - pyproj
    - h5py
    - segyio
    - nptdms
    - tqdm

test:
  imports:
    - daspy
  commands:
    - pip check
  requires:
    - python ={{ python_min }}
    - pip

about:
  home: https://github.com/HMZ-03/DASPy
  summary: DASPy is an open-source project dedicated to provide a python package for DAS (Distributed Acoustic Sensing) data processing, which comprises classic seismic data processing techniques and Specialized algorithms for DAS applications.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - HMZ-03
